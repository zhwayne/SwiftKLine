name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "script/validate-docs.py"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "script/validate-docs.py"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: ./script/validate-docs.py
